[project]
name = "voice-interview-coach"
version = "0.1.0"
description = "Real-time voice agent that runs mock behavioural interviews"
requires-python = ">=3.10"
# Dependencies live in requirements.txt, not here. Restating them makes `pip install -e .`
# re-resolve the whole tree, which conflicts with nvidia-riva-client's own pins.
# This file exists only so `src/` is importable as a package.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Vercel loads this ASGI app directly rather than running `python -m coach`, so the uvicorn
# entry point in __main__.py is unused there. The target is the root-level app.py shim, because
# Vercel resolves entrypoints from the project root and this package lives under src/.
[tool.vercel]
entrypoint = "app:app"
